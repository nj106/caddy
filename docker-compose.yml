# Caddy: public HTTPS entry for all services (replaces Cloudflare Tunnel).
# host network mode: 127.0.0.1 in Caddyfile = the VPS itself, so upstreams
# are the services' published host ports (no Docker DNS needed).
services:
  caddy:
    image: ghcr.io/nj106/caddy:latest
    container_name: caddy
    network_mode: host
    labels:
      - com.centurylinklabs.watchtower.enable=true
    restart: unless-stopped
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:
    name: caddy_data
